<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SideBySide Editor</title>
<style>
:root {
  --bg: #1a1a2e;
  --panel-bg: #16213e;
  --panel-bg-secondary: #1a1a35;
  --text: #e0e0e0;
  --text-dim: #888;
  --input-bg: #0f3460;
  --input-border: #1a4a7a;
  --accent: #e94560;
  --accent-hover: #ff6b81;
  --toolbar-bg: #0f3460;
  --divider-bg: #2a2a5a;
  --divider-hover: #e94560;
  --border: #2a2a5a;
  --shadow: rgba(0,0,0,0.3);
  --dropzone-bg: rgba(15,52,96,0.5);
  --dropzone-border: #1a4a7a;
  --btn-bg: #0f3460;
  --btn-hover: #1a4a7a;
  --btn-active: #e94560;
  --radius: 8px;
  --font-main: 'Inter', system-ui, -apple-system, sans-serif;
}

[data-theme="light"] {
  --bg: #e8e8ec;
  --panel-bg: #ffffff;
  --panel-bg-secondary: #f0f0f5;
  --text: #222222;
  --text-dim: #888;
  --input-bg: #f0f0f5;
  --input-border: #ddd;
  --toolbar-bg: #f5f5f5;
  --divider-bg: #ccc;
  --divider-hover: #e94560;
  --border: #ddd;
  --shadow: rgba(0,0,0,0.1);
  --dropzone-bg: rgba(240,240,245,0.8);
  --dropzone-border: #ccc;
  --btn-bg: #e8e8ec;
  --btn-hover: #ddd;
  --btn-active: #e94560;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; overflow: hidden; }

body {
  font-family: var(--font-main);
  background: var(--bg);
  color: var(--text);
  display: flex;
  flex-direction: column;
  user-select: none;
  transition: background .3s, color .3s;
}

/* ─── TOP BAR ─── */
#topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 16px;
  background: var(--panel-bg);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  gap: 12px;
  z-index: 10;
}
#topbar h1 {
  font-size: 16px; font-weight: 700;
  background: linear-gradient(135deg, var(--accent), #ff8a5c);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  white-space: nowrap;
}
.topbar-actions {
  display: flex; align-items: center; gap: 6px;
  position: relative;
}
.topbar-actions button {
  background: var(--btn-bg);
  color: var(--text);
  border: 1px solid var(--input-border);
  border-radius: 6px;
  padding: 6px 10px;
  cursor: pointer;
  font-size: 14px;
  transition: background .15s;
  display: flex; align-items: center; justify-content: center;
}
.topbar-actions button:hover { background: var(--btn-hover); }
.topbar-actions button:active { background: var(--accent); }

/* ─── CONFIG GUI DROPDOWN ─── */
#configGuiWrapper {
  position: relative;
}
#configGuiBtn {
  background: var(--accent) !important;
  color: #fff !important;
  border-color: var(--accent) !important;
  padding: 6px 14px !important;
  font-size: 13px !important;
  font-weight: 600;
  white-space: nowrap;
}
#configGuiBtn:hover { opacity: .85; }
#configGuiBtn.active {
  background: var(--btn-bg) !important;
  color: var(--text) !important;
  border-color: var(--input-border) !important;
}

.config-dropdown {
  position: absolute;
  top: 100%;
  right: 0;
  margin-top: 6px;
  background: var(--panel-bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  box-shadow: 0 8px 32px var(--shadow);
  min-width: 240px;
  z-index: 50;
  display: none;
  overflow: hidden;
}
.config-dropdown.open { display: block; }

.config-option {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  cursor: pointer;
  transition: background .15s;
  font-size: 13px;
  border-bottom: 1px solid var(--border);
}
.config-option:last-child { border-bottom: none; }
.config-option:hover { background: var(--input-bg); }
.config-option.selected { background: var(--input-bg); }

.config-option .config-icon {
  display: flex;
  gap: 3px;
  font-size: 16px;
  opacity: 0.7;
  min-width: 36px;
  justify-content: center;
}
.config-option .config-label { flex: 1; }
.config-option .config-check {
  color: var(--accent);
  font-weight: 700;
  font-size: 14px;
  min-width: 16px;
  text-align: center;
}

/* ─── WORKSPACE ─── */
#workspace {
  flex: 1; display: flex; overflow: hidden;
  position: relative;
}

/* ─── PANELS ─── */
.panel {
  height: 100%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}
#leftPanel {
  width: 50%;
  background: var(--panel-bg);
  border-right: 1px solid var(--border);
  transition: background .3s;
}
#rightPanel {
  flex: 1;
  background: var(--panel-bg-secondary);
  transition: background .3s;
}

/* ─── DIVIDER ─── */
#divider {
  width: 6px;
  cursor: col-resize;
  background: var(--divider-bg);
  flex-shrink: 0;
  position: relative;
  z-index: 5;
  transition: background .15s;
}
#divider:hover, #divider.active {
  background: var(--divider-hover);
}
#divider::after {
  content: '';
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 2px; height: 32px;
  background: rgba(255,255,255,0.15);
  border-radius: 1px;
}

/* ─── DROP ZONES CONTAINER ─── */
#dropZonesContainer {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.drop-zone-wrapper {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0;
  position: relative;
}
.drop-zone-wrapper + .drop-zone-wrapper {
  border-top: 2px solid var(--border);
}
.drop-zone-wrapper.active-zone .drop-zone {
  box-shadow: inset 0 0 0 2px var(--accent);
}

.drop-zone {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}
.drop-zone.has-image { cursor: default; }
.drop-zone.dragover {
  background: var(--dropzone-bg);
}
.drop-zone.has-image .drop-content { display: none; }

.drop-content {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  color: var(--text-dim);
  text-align: center;
  padding: 24px;
}
.drop-content .drop-icon {
  font-size: 48px;
  opacity: 0.4;
}
.drop-content p { font-size: 14px; line-height: 1.4; }
.drop-content .sub { font-size: 12px; opacity: 0.6; }
.attach-btn {
  background: var(--accent);
  color: #fff;
  border: none;
  padding: 8px 20px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
  transition: opacity .15s;
}
.attach-btn:hover { opacity: .85; }

.image-preview {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  display: none;
  transition: transform .2s;
}
.drop-zone.has-image .image-preview { display: block; }

.paste-hint {
  position: absolute;
  bottom: 8px; left: 50%;
  transform: translateX(-50%);
  font-size: 11px;
  color: var(--text-dim);
  opacity: 0;
  transition: opacity .3s;
  pointer-events: none;
}
.drop-zone:hover .paste-hint { opacity: 0.6; }

.img-title-overlay {
  position: absolute;
  top: 12px; right: 12px;
  font-size: 20px;
  font-weight: 700;
  color: #fff;
  -webkit-text-stroke: 1.5px #000;
  text-shadow: 0 0 4px rgba(0,0,0,0.5);
  pointer-events: none;
  z-index: 2;
  max-width: 70%;
  text-align: right;
  line-height: 1.2;
  word-break: break-word;
  display: none;
}
.drop-zone.has-image .img-title-overlay { display: block; }

/* ─── ACTIVE INDICATOR ─── */
.active-indicator {
  font-size: 11px;
  color: var(--accent);
  padding: 2px 8px;
  white-space: nowrap;
  flex-shrink: 0;
}

/* ─── IMAGE TOOLS ─── */
#imageTools {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  background: var(--toolbar-bg);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
  flex-wrap: wrap;
}
#imageTools label {
  font-size: 12px;
  display: flex;
  align-items: center;
  gap: 4px;
  color: var(--text-dim);
}
#imageTools input[type="range"] {
  width: 80px;
  accent-color: var(--accent);
}
#imageTools button {
  background: var(--btn-bg);
  color: var(--text);
  border: 1px solid var(--input-border);
  border-radius: 4px;
  padding: 4px 8px;
  cursor: pointer;
  font-size: 14px;
  transition: background .15s;
}
#imageTools button:hover { background: var(--btn-hover); }
#zoomValue { font-size: 12px; color: var(--text-dim); min-width: 36px; text-align: center; }

/* Fit/Fill switch */
.fit-switch {
  display: flex; align-items: center; gap: 6px;
  margin-left: auto;
}
.fit-switch span { font-size: 12px; color: var(--text-dim); cursor: pointer; padding: 2px 6px; border-radius: 4px; transition: all .15s; }
.fit-switch span.active { color: var(--text); background: var(--accent); }
.rotate-group { display: flex; gap: 2px; }
.img-title-label {
  display: flex !important;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  color: var(--text-dim);
  white-space: nowrap;
}
.img-title-label input[type="text"] {
  width: 130px;
  background: var(--input-bg);
  color: var(--text);
  border: 1px solid var(--input-border);
  border-radius: 4px;
  padding: 3px 6px;
  font-size: 12px;
  outline: none;
}
.img-title-label input[type="text"]:focus {
  border-color: var(--accent);
}

/* ─── TEXT TOOLBAR ─── */
#toolbar {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 6px 8px;
  background: var(--toolbar-bg);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  flex-wrap: wrap;
}
#toolbar button {
  background: none;
  color: var(--text);
  border: 1px solid transparent;
  border-radius: 4px;
  padding: 4px 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all .15s;
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 30px;
  height: 30px;
}
#toolbar button:hover { background: var(--btn-bg); border-color: var(--input-border); }
#toolbar button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
#toolbar button.bold-btn { font-weight: 700; }
#toolbar button.italic-btn { font-style: italic; }
#toolbar button.underline-btn { text-decoration: underline; }

.toolbar-sep {
  width: 1px; height: 22px;
  background: var(--border);
  margin: 0 4px;
  flex-shrink: 0;
}

/* Alignment icon buttons */
.align-icon {
  display: flex; flex-direction: column; gap: 2px;
  width: 14px; height: 14px;
  justify-content: center;
}
.align-icon span {
  display: block; height: 2px;
  background: currentColor;
  border-radius: 1px;
}
.align-left span:nth-child(1) { width: 60%; }
.align-left span:nth-child(2) { width: 80%; }
.align-left span:nth-child(3) { width: 100%; }
.align-center span:nth-child(1) { width: 80%; margin: 0 auto; }
.align-center span:nth-child(2) { width: 60%; margin: 0 auto; }
.align-center span:nth-child(3) { width: 80%; margin: 0 auto; }
.align-right span:nth-child(1) { width: 100%; margin-left: auto; }
.align-right span:nth-child(2) { width: 80%; margin-left: auto; }
.align-right span:nth-child(3) { width: 60%; margin-left: auto; }

#toolbar select {
  background: var(--input-bg);
  color: var(--text);
  border: 1px solid var(--input-border);
  border-radius: 4px;
  padding: 3px 6px;
  font-size: 12px;
  max-width: 130px;
  cursor: pointer;
}
#toolbar input[type="color"] {
  width: 28px; height: 28px;
  border: 1px solid var(--input-border);
  border-radius: 4px;
  cursor: pointer;
  background: none;
  padding: 1px;
}
#toolbar .range-label {
  display: flex; align-items: center; gap: 4px;
  font-size: 11px;
  color: var(--text-dim);
  white-space: nowrap;
}
#toolbar .range-label input[type="range"] {
  width: 200px;
  accent-color: var(--accent);
}
.range-value { min-width: 24px; text-align: center; font-size: 11px; }
.numeric-stepper { display: inline-flex; flex-direction: column; gap: 1px; margin-left: 2px; }
.numeric-stepper .step-btn {
  display: flex; align-items: center; justify-content: center;
  width: 16px; height: 10px; padding: 0;
  background: var(--btn-bg); color: var(--text);
  border: 1px solid var(--input-border); border-radius: 2px;
  cursor: pointer; font-size: 7px; line-height: 1;
  transition: background .15s;
}
.numeric-stepper .step-btn:hover { background: var(--btn-hover); }
.numeric-stepper .step-btn:active { background: var(--accent); }

/* ─── TEXT EDITORS CONTAINER ─── */
#textEditorsContainer {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.text-editor-wrapper {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.text-editor-wrapper + .text-editor-wrapper {
  border-top: 2px solid var(--border);
}
.text-editor-wrapper.active-editor {
  box-shadow: inset 0 2px 0 var(--accent);
}

.text-editor {
  flex: 1;
  padding: 24px;
  outline: none;
  overflow-y: auto;
  font-size: 32px;
  line-height: 1.5;
  color: var(--text);
  user-select: text;
  cursor: text;
  word-wrap: break-word;
}
.text-editor:empty::before {
  content: attr(data-placeholder);
  color: var(--text-dim);
  opacity: 0.5;
}
.text-editor::-webkit-scrollbar { width: 6px; }
.text-editor::-webkit-scrollbar-track { background: transparent; }
.text-editor::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* ─── PREVIEW ─── */
#textPreviewSection {
  flex-shrink: 0;
  min-height: 100px;
  max-height: 40%;
  display: flex;
  flex-direction: column;
  border-top: 1px solid var(--border);
  background: var(--panel-bg-secondary);
  transition: background .3s;
}
#textPreviewHeader {
  font-size: 11px;
  color: var(--text-dim);
  padding: 3px 12px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
#textPreviewContent {
  display: block;
  max-width: 100%;
  object-fit: contain;
  margin: 0 auto;
}

/* ─── BOTTOM BAR ─── */
#bottombar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 16px;
  background: var(--panel-bg);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
  flex-wrap: wrap;
  z-index: 10;
}
#bottombar button {
  background: var(--btn-bg);
  color: var(--text);
  border: 1px solid var(--input-border);
  border-radius: 6px;
  padding: 6px 12px;
  cursor: pointer;
  font-size: 12px;
  transition: all .15s;
  white-space: nowrap;
}
#bottombar button:hover { background: var(--btn-hover); }
#bottombar button.active { background: var(--accent); color: #fff; border-color: var(--accent); }

.ar-group {
  display: flex; gap: 2px;
  align-items: center;
}
.ar-group label { font-size: 11px; color: var(--text-dim); margin-right: 4px; }

.custom-inputs {
  display: flex; align-items: center; gap: 4px;
}
.custom-inputs input[type="number"] {
  width: 56px;
  background: var(--input-bg);
  color: var(--text);
  border: 1px solid var(--input-border);
  border-radius: 4px;
  padding: 4px 6px;
  font-size: 12px;
  text-align: center;
}
.custom-inputs span { font-size: 11px; color: var(--text-dim); }

.export-group {
  display: flex; gap: 4px;
  margin-left: auto;
}
.export-group button.active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
.export-group button.active:hover { opacity: .85; background: var(--accent); }

#invertBtn {
  font-size: 16px !important;
}

/* ─── CANVAS (hidden) ─── */
#exportCanvas { display: none; }

/* ─── RESPONSIVE ─── */
@media (max-width: 768px) {
  #topbar { padding: 6px 10px; }
  #topbar h1 { font-size: 14px; }
  #bottombar { padding: 6px 10px; gap: 6px; }
  #toolbar { padding: 4px 6px; }
  #toolbar select { max-width: 100px; }
  .text-editor { padding: 12px; }
  .custom-inputs input[type="number"] { width: 44px; }
  .config-dropdown { right: auto; left: 0; }
}

/* ─── TOAST ─── */
#toast {
  position: fixed;
  bottom: 60px; left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--panel-bg);
  color: var(--text);
  padding: 8px 16px;
  border-radius: 8px;
  border: 1px solid var(--border);
  font-size: 13px;
  opacity: 0;
  transition: all .3s;
  pointer-events: none;
  z-index: 100;
  box-shadow: 0 4px 20px var(--shadow);
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ─── IMG HEIGHT MODE HIDE DROP ZONES ─── */
</style>
</head>
<body>

<!-- ─── TOP BAR ─── -->
<header id="topbar">
  <h1>SideBySide Editor</h1>
  <div class="topbar-actions">
    <div id="configGuiWrapper">
      <button id="configGuiBtn" title="Layout Configuration">Config GUI ▾</button>
      <div id="configDropdown" class="config-dropdown">
        <div class="config-option selected" data-config="1i1t">
          <span class="config-icon">◻ T</span>
          <span class="config-label">1 Image + 1 Text</span>
          <span class="config-check">✓</span>
        </div>
        <div class="config-option" data-config="1i2t">
          <span class="config-icon">◻ T|T</span>
          <span class="config-label">1 Image + 2 Texts</span>
          <span class="config-check"></span>
        </div>
        <div class="config-option" data-config="2i1t">
          <span class="config-icon">◻◻ T</span>
          <span class="config-label">2 Images + 1 Text</span>
          <span class="config-check"></span>
        </div>
        <div class="config-option" data-config="2i2t">
          <span class="config-icon">◻◻ T|T</span>
          <span class="config-label">2 Images + 2 Texts</span>
          <span class="config-check"></span>
        </div>
        <div class="config-option" data-config="3i1t">
          <span class="config-icon">◻◻◻ T</span>
          <span class="config-label">3 Images + 1 Text</span>
          <span class="config-check"></span>
        </div>
        <div class="config-option" data-config="4i1t">
          <span class="config-icon">◻◻◻◻ T</span>
          <span class="config-label">4 Images + 1 Text</span>
          <span class="config-check"></span>
        </div>
        <div class="config-option" data-config="5i1t">
          <span class="config-icon">◻◻◻◻◻ T</span>
          <span class="config-label">5 Images + 1 Text</span>
          <span class="config-check"></span>
        </div>
      </div>
    </div>
    <button id="undoBtn" title="Undo (Ctrl+Z)">↩</button>
    <button id="redoBtn" title="Redo (Ctrl+Shift+Z)">↪</button>
    <button id="themeToggle" title="Toggle Theme"></button>
  </div>
</header>

<!-- ─── WORKSPACE ─── -->
<main id="workspace">
  <div id="leftPanel" class="panel">
    <div id="dropZonesContainer">
      <!-- Drop zones created dynamically by buildLayout() -->
    </div>
    <div id="textPreviewSection">
      <div id="textPreviewHeader">Preview</div>
      <img id="textPreviewContent" alt="Preview">
    </div>
    <div id="imageTools">
      <span id="activeImgIndicator" class="active-indicator"></span>
      <label>Zoom
        <input type="range" id="zoomSlider" min="10" max="300" value="100">
        <span id="zoomValue">100%</span>
      </label>
      <div class="rotate-group">
        <button id="rotateCCW" title="Rotate 90° CCW">↺</button>
        <button id="rotateCW" title="Rotate 90° CW">↻</button>
        <button id="zoomResetBtn" title="Reset zoom to 100%">Set 100%</button>
      </div>
      <div class="fit-switch">
        <span id="fitOpt" class="active">Fit</span>
        <span id="fillOpt">Fill</span>
      </div>
      <label class="img-title-label">Title
        <input type="text" id="imgTitleInput" placeholder="Add image title..." maxlength="100">
      </label>
    </div>
  </div>

  <div id="divider"></div>

  <div id="rightPanel" class="panel" style="background:var(--panel-bg-secondary);">
    <div id="toolbar">
      <span id="activeTextIndicator" class="active-indicator"></span>
      <button id="boldBtn" class="bold-btn" title="Bold (Ctrl+B)">B</button>
      <button id="italicBtn" class="italic-btn" title="Italic (Ctrl+I)">I</button>
      <button id="underlineBtn" class="underline-btn" title="Underline (Ctrl+U)">U</button>
      <div class="toolbar-sep"></div>
      <button id="alignLeft" title="Align Left">
        <span class="align-icon align-left"><span></span><span></span><span></span></span>
      </button>
      <button id="alignCenter" title="Align Center">
        <span class="align-icon align-center"><span></span><span></span><span></span></span>
      </button>
      <button id="alignRight" title="Align Right">
        <span class="align-icon align-right"><span></span><span></span><span></span></span>
      </button>
      <div class="toolbar-sep"></div>
      <input type="color" id="textColorInput" title="Text Color" value="#ffffff">
      <input type="color" id="bgColorInput" title="Panel Background" value="#1a1a35">
      <div class="toolbar-sep"></div>
      <select id="fontSelect" title="Font Family"></select>

      <label class="range-label">Size
        <input type="range" id="fontSizeSlider" min="12" max="120" value="32">
        <span class="range-value" id="fontSizeVal">32</span>
        <span class="numeric-stepper">
          <button class="step-btn step-up" title="Increase">▲</button>
          <button class="step-btn step-down" title="Decrease">▼</button>
        </span>
      </label>
      <label class="range-label">Space
        <input type="range" id="letterSpacingSlider" min="0" max="20" value="0" step="0.5">
        <span class="range-value" id="letterSpacingVal">0</span>
      </label>
    </div>
    <div id="textEditorsContainer">
      <!-- Text editors created dynamically by buildLayout() -->
    </div>
  </div>

</main>

<!-- ─── BOTTOM BAR ─── -->
<footer id="bottombar">
  <div class="ar-group">
    <label>Ratio</label>
    <button id="imgHeightBtn" class="active" title="Match canvas height to image height">IMG-Height</button>
    <button data-ar="1:1">1:1</button>
    <button data-ar="16:9">16:9</button>
    <button data-ar="21:9">21:9</button>
    <button data-ar="4:5">4:5</button>
    <button data-ar="custom">Custom</button>
  </div>
  <div class="custom-inputs" id="customArInputs" style="display:none">
    <input type="number" id="customW" value="1920" min="100" max="8000">
    <span>×</span>
    <input type="number" id="customH" value="1080" min="100" max="8000">
  </div>
  <div class="toolbar-sep"></div>
  <button id="invertBtn" title="Swap Panel Order">⇄ Swap</button>
  <div class="toolbar-sep"></div>
  <div class="export-group">
    <button id="downloadWebP" data-format="webp" class="active">WebP</button>
    <button id="downloadPNG" data-format="png">PNG</button>
    <button id="downloadJPG" data-format="jpeg">JPG</button>
    <button id="copyImage">📋 Copy</button>
  </div>
</footer>

<canvas id="exportCanvas"></canvas>
<div id="toast"></div>

<script>
(function() {
'use strict';

/* ═══════════════════════════════════════
   FONTS
   ═══════════════════════════════════════ */
const FONTS = [
  'Inter', 'Roboto', 'Open Sans', 'Lato', 'Montserrat',
  'Poppins', 'Noto Sans', 'Ubuntu', 'Raleway', 'Playfair Display',
  'Merriweather', 'Source Sans Pro', 'Oswald', 'Lobster', 'Pacifico',
  'Dancing Script', 'Bebas Neue', 'Fira Sans', 'Quicksand', 'Work Sans',
  'Nunito', 'Rubik', 'Josefin Sans', 'Caveat', 'Comfortaa'
];

/* ═══════════════════════════════════════
   STATE
   ═══════════════════════════════════════ */
function makeDefaultImage() {
  return { dataUrl: null, zoom: 100, rotation: 0, fitFill: 'fit', naturalW: 0, naturalH: 0, title: '' };
}
function makeDefaultText() {
  return {
    html: '',
    fontFamily: 'Inter',
    fontSize: 32,
    letterSpacing: 0,
    textColor: '#ffffff',
    textAlign: 'left'
  };
}

const state = {
  config: '1i1t',
  images: [makeDefaultImage()],
  texts: [makeDefaultText()],
  activeImageIdx: 0,
  activeTextIdx: 0,
  bgColor: '#1a1a35',
  aspectRatio: '1:1',
  customW: 1920,
  customH: 1080,
  panelOrder: 'normal',
  leftPanelPct: 50,
  canvasScale: 2,
  imgHeightMode: true,
  theme: 'dark',
  downloadFormat: 'webp'
};

/* ═══════════════════════════════════════
   UNDO / REDO
   ═══════════════════════════════════════ */
const undoStack = [];
const redoStack = [];
const MAX_UNDO = 50;

function cloneState() {
  return {
    config: state.config,
    images: state.images.map(img => ({ ...img, dataUrl: img.dataUrl })),
    texts: state.texts.map(txt => ({ ...txt })),
    activeImageIdx: state.activeImageIdx,
    activeTextIdx: state.activeTextIdx,
    bgColor: state.bgColor,
    aspectRatio: state.aspectRatio,
    customW: state.customW,
    customH: state.customH,
    panelOrder: state.panelOrder,
    leftPanelPct: state.leftPanelPct,
    canvasScale: state.canvasScale,
    imgHeightMode: state.imgHeightMode,
    theme: state.theme
  };
}

function pushSnapshot() {
  undoStack.push(cloneState());
  redoStack.length = 0;
  if (undoStack.length > MAX_UNDO) undoStack.shift();
  updateUndoButtons();
}

function undo() {
  if (undoStack.length < 2) return;
  const current = undoStack.pop();
  redoStack.push(current);
  const prev = undoStack[undoStack.length - 1];
  applySnapshot(prev);
  updateUndoButtons();
  scheduleRender();
}

function redo() {
  if (redoStack.length === 0) return;
  const next = redoStack.pop();
  undoStack.push(next);
  applySnapshot(next);
  updateUndoButtons();
  scheduleRender();
}

function applySnapshot(snap) {
  // Read text HTML from editors before overwriting
  syncTextsFromEditors();

  state.config = snap.config;
  state.images = snap.images.map(i => ({ ...i, dataUrl: i.dataUrl }));
  state.texts = snap.texts.map(t => ({ ...t }));
  state.activeImageIdx = Math.min(snap.activeImageIdx, state.images.length - 1);
  state.activeTextIdx = Math.min(snap.activeTextIdx, state.texts.length - 1);
  state.bgColor = snap.bgColor;
  state.aspectRatio = snap.aspectRatio;
  state.customW = snap.customW;
  state.customH = snap.customH;
  state.panelOrder = snap.panelOrder;
  state.leftPanelPct = snap.leftPanelPct;
  state.canvasScale = snap.canvasScale;
  state.imgHeightMode = snap.imgHeightMode;
  state.theme = snap.theme;

  rebuildLayout();
  syncUIFromState();
}

function updateUndoButtons() {
  document.getElementById('undoBtn').style.opacity = undoStack.length < 2 ? '0.3' : '1';
  document.getElementById('redoBtn').style.opacity = redoStack.length === 0 ? '0.3' : '1';
}

/* ═══════════════════════════════════════
   THEME
   ═══════════════════════════════════════ */
function setTheme(theme) {
  state.theme = theme;
  document.documentElement.setAttribute('data-theme', theme);
  document.getElementById('themeToggle').textContent = theme === 'dark' ? '🌙' : '☀️';
  localStorage.setItem('sbs-theme', theme);
}

/* ═══════════════════════════════════════
   DOM REFS
   ═══════════════════════════════════════ */
const $ = id => document.getElementById(id);
const dropZonesContainer = $('dropZonesContainer');
const textEditorsContainer = $('textEditorsContainer');
const imagePreview = () => document.querySelector('.drop-zone.active-zone .image-preview');
const activeDropZone = () => document.querySelector('.drop-zone-wrapper.active-zone');
const activeTextWrapper = () => document.querySelector('.text-editor-wrapper.active-editor');
const activeTextEditor = () => activeTextWrapper() ? activeTextWrapper().querySelector('.text-editor') : null;
const zoomSlider = $('zoomSlider');
const zoomValue = $('zoomValue');
const rotateCCW = $('rotateCCW');
const rotateCW = $('rotateCW');
const zoomResetBtn = $('zoomResetBtn');
const fitOpt = $('fitOpt');
const fillOpt = $('fillOpt');
const boldBtn = $('boldBtn');
const italicBtn = $('italicBtn');
const underlineBtn = $('underlineBtn');
const alignLeft = $('alignLeft');
const alignCenter = $('alignCenter');
const alignRight = $('alignRight');
const textColorInput = $('textColorInput');
const bgColorInput = $('bgColorInput');
const fontSelect = $('fontSelect');
const fontSizeSlider = $('fontSizeSlider');
const fontSizeVal = $('fontSizeVal');
const letterSpacingSlider = $('letterSpacingSlider');
const letterSpacingVal = $('letterSpacingVal');
const divider = $('divider');
const invertBtn = $('invertBtn');
const canvas = $('exportCanvas');
const ctx = canvas.getContext('2d');
const toast = $('toast');
const leftPanel = $('leftPanel');
const rightPanel = $('rightPanel');
const workspace = $('workspace');
const activeImgIndicator = $('activeImgIndicator');
const activeTextIndicator = $('activeTextIndicator');

/* ═══════════════════════════════════════
   CONFIG GUI
   ═══════════════════════════════════════ */
const configBtn = $('configGuiBtn');
const configDropdown = $('configDropdown');

function toggleConfigDropdown(e) {
  e.stopPropagation();
  configDropdown.classList.toggle('open');
  configBtn.classList.toggle('active');
}

function closeConfigDropdown() {
  configDropdown.classList.remove('open');
  configBtn.classList.remove('active');
}

function selectConfig(config) {
  if (config === state.config) { closeConfigDropdown(); return; }

  // Sync current editors
  syncTextsFromEditors();

  // Parse counts from config string e.g. "3i1t" → imgCount=3, txtCount=1
  const parts = config.split('i');
  const imgCount = parseInt(parts[0], 10);
  const txtCount = parseInt(parts[1], 10);

  // Adjust images array
  while (state.images.length < imgCount) state.images.push(makeDefaultImage());
  while (state.images.length > imgCount) state.images.pop();

  // Adjust texts array
  while (state.texts.length < txtCount) state.texts.push(makeDefaultText());
  while (state.texts.length > txtCount) state.texts.pop();

  state.config = config;
  state.activeImageIdx = Math.min(state.activeImageIdx, state.images.length - 1);
  state.activeTextIdx = Math.min(state.activeTextIdx, state.texts.length - 1);

  // Update dropdown UI
  document.querySelectorAll('.config-option').forEach(opt => {
    const isSelected = opt.dataset.config === config;
    opt.classList.toggle('selected', isSelected);
    opt.querySelector('.config-check').textContent = isSelected ? '✓' : '';
  });

  rebuildLayout();
  syncUIFromState();
  snapshotAndRender();
  closeConfigDropdown();
}

/* ═══════════════════════════════════════
   LAYOUT BUILDER
   ═══════════════════════════════════════ */
function rebuildLayout() {
  buildDropZones();
  buildTextEditors();
}

function buildDropZones() {
  dropZonesContainer.innerHTML = '';
  state.images.forEach((img, i) => {
    const wrapper = document.createElement('div');
    wrapper.className = 'drop-zone-wrapper' + (i === state.activeImageIdx ? ' active-zone' : '');
    wrapper.dataset.index = i;
    wrapper.innerHTML = `
      <div class="drop-zone${img.dataUrl ? ' has-image' : ''}" data-index="${i}">
        <div class="drop-content">
          <div class="drop-icon">🖼</div>
          <p>Drop your image here</p>
          <button class="attach-btn" data-index="${i}">Attach Image</button>
          <p class="sub">or paste from clipboard (Ctrl+V)</p>
        </div>
        <img class="image-preview" alt="Preview" crossorigin="anonymous" data-index="${i}">
        <div class="img-title-overlay" data-index="${i}">${img.title || ''}</div>
        <div class="paste-hint">Ctrl+V to paste image</div>
      </div>`;
    dropZonesContainer.appendChild(wrapper);

    // Bind drop zone events
    const zone = wrapper.querySelector('.drop-zone');
    const preview = wrapper.querySelector('.image-preview');
    const attach = wrapper.querySelector('.attach-btn');

    zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('dragover'); });
    zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
    zone.addEventListener('drop', e => {
      e.preventDefault();
      zone.classList.remove('dragover');
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('image/')) loadImageToIndex(i, file);
    });

    zone.addEventListener('click', () => {
      setActiveImage(i);
    });

    attach.addEventListener('click', e => {
      e.stopPropagation();
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.onchange = () => { if (input.files[0]) loadImageToIndex(i, input.files[0]); };
      input.click();
    });

    // Restore image if data exists
    if (img.dataUrl) {
      preview.src = img.dataUrl;
      zone.classList.add('has-image');
      applyImageTransform(i);
    }
  });
}

function buildTextEditors() {
  textEditorsContainer.innerHTML = '';
  state.texts.forEach((txt, i) => {
    const wrapper = document.createElement('div');
    wrapper.className = 'text-editor-wrapper' + (i === state.activeTextIdx ? ' active-editor' : '');
    wrapper.dataset.index = i;
    const editor = document.createElement('div');
    editor.className = 'text-editor';
    editor.contentEditable = true;
    editor.dataset.index = i;
    editor.dataset.placeholder = `Type your text here...`;
    editor.spellcheck = true;
    editor.innerHTML = txt.html;
    // Apply styling
    editor.style.fontFamily = `"${txt.fontFamily}", sans-serif`;
    editor.style.fontSize = txt.fontSize + 'px';
    editor.style.letterSpacing = txt.letterSpacing + 'px';
    editor.style.textAlign = txt.textAlign;
    editor.style.color = txt.textColor;
    wrapper.appendChild(editor);

    editor.addEventListener('focus', () => setActiveText(i));
    editor.addEventListener('input', () => {
      state.texts[i].html = editor.innerHTML;
      adjustTextVerticalCenter(editor);
      debouncedSnapshot();
      scheduleRender();
    });

    // Keyboard shortcuts for formatting
    editor.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && ['b','i','u'].includes(e.key)) {
        e.stopPropagation();
      }
    });

    textEditorsContainer.appendChild(wrapper);
  });
}

/* ═══════════════════════════════════════
   ACTIVE INDEX MANAGEMENT
   ═══════════════════════════════════════ */
function setActiveImage(idx) {
  if (state.activeImageIdx === idx) return;
  state.activeImageIdx = idx;
  // Update visual
  document.querySelectorAll('.drop-zone-wrapper').forEach((w, i) => {
    w.classList.toggle('active-zone', i === idx);
  });
  syncImageToolsFromState();
}

function setActiveText(idx) {
  if (state.activeTextIdx === idx) return;
  state.activeTextIdx = idx;
  document.querySelectorAll('.text-editor-wrapper').forEach((w, i) => {
    w.classList.toggle('active-editor', i === idx);
  });
  syncTextToolsFromState();
}

/* ═══════════════════════════════════════
   SYNC UI ← STATE
   ═══════════════════════════════════════ */
function syncUIFromState() {
  // Theme
  setTheme(state.theme);
  document.getElementById('themeToggle').textContent = state.theme === 'dark' ? '🌙' : '☀️';

  // Config dropdown
  document.querySelectorAll('.config-option').forEach(opt => {
    const isSelected = opt.dataset.config === state.config;
    opt.classList.toggle('selected', isSelected);
    opt.querySelector('.config-check').textContent = isSelected ? '✓' : '';
  });

  // Image tools
  syncImageToolsFromState();

  // Text tools
  syncTextToolsFromState();

  // Background color
  bgColorInput.value = state.bgColor;
  rightPanel.style.background = state.bgColor;
  document.querySelectorAll('.text-editor-wrapper').forEach((w, i) => {
    const editor = w.querySelector('.text-editor');
    if (editor) editor.style.color = state.texts[i] ? state.texts[i].textColor : state.texts[0]?.textColor || '#ffffff';
  });

  // IMG-Height button
  $('imgHeightBtn').classList.toggle('active', state.imgHeightMode);

  // Aspect ratio
  document.querySelectorAll('.ar-group button[data-ar]').forEach(b => b.classList.remove('active'));
  if (!state.imgHeightMode) {
    const arBtn = document.querySelector(`.ar-group button[data-ar="${state.aspectRatio}"]`);
    if (arBtn) arBtn.classList.add('active');
  }
  $('customArInputs').style.display = state.aspectRatio === 'custom' ? 'flex' : 'none';
  $('customW').value = state.customW;
  $('customH').value = state.customH;

  // Panel order
  workspace.style.flexDirection = state.panelOrder === 'inverted' ? 'row-reverse' : 'row';

  // Left panel width
  leftPanel.style.width = state.leftPanelPct + '%';

  // Image Height mode
  requestAnimationFrame(() => {
    document.querySelectorAll('.text-editor').forEach(ed => adjustTextVerticalCenter(ed));
  });

  // Download format
  document.querySelectorAll('.export-group button[data-format]').forEach(b => {
    b.classList.toggle('active', b.dataset.format === state.downloadFormat);
  });
}

function syncImageToolsFromState() {
  const img = state.images[state.activeImageIdx] || state.images[0];
  zoomSlider.value = img.zoom;
  zoomValue.textContent = img.zoom + '%';
  if (img.fitFill === 'fit') { fitOpt.classList.add('active'); fillOpt.classList.remove('active'); }
  else { fillOpt.classList.add('active'); fitOpt.classList.remove('active'); }
  activeImgIndicator.textContent = state.images.length > 1 ? `Image ${state.activeImageIdx + 1}` : '';
  const titleInput = $('imgTitleInput');
  if (titleInput) titleInput.value = img.title || '';
}

function syncTextToolsFromState() {
  const txt = state.texts[state.activeTextIdx] || state.texts[0];
  if (!txt) return;
  textColorInput.value = txt.textColor;
  fontSelect.value = txt.fontFamily;
  fontSizeSlider.value = txt.fontSize;
  fontSizeVal.textContent = txt.fontSize;
  letterSpacingSlider.value = txt.letterSpacing;
  letterSpacingVal.textContent = txt.letterSpacing;

  document.querySelectorAll('#toolbar button[title*="Align"]').forEach(b => b.classList.remove('active'));
  if (txt.textAlign === 'left') alignLeft.classList.add('active');
  else if (txt.textAlign === 'center') alignCenter.classList.add('active');
  else if (txt.textAlign === 'right') alignRight.classList.add('active');

  activeTextIndicator.textContent = state.texts.length > 1 ? `Text ${state.activeTextIdx + 1}` : '';
}

function adjustTextVerticalCenter(editor) {
  if (!editor) return;
  const defaultPad = 24;
  editor.style.paddingTop = '';
  editor.style.paddingBottom = '';
  const scrollH = editor.scrollHeight;
  const clientH = editor.clientHeight;
  if (scrollH <= clientH) {
    const extra = Math.floor((clientH - scrollH) / 2);
    editor.style.paddingTop = (defaultPad + Math.max(0, extra)) + 'px';
    editor.style.paddingBottom = (defaultPad + Math.max(0, extra)) + 'px';
  } else {
    editor.style.paddingTop = defaultPad + 'px';
    editor.style.paddingBottom = defaultPad + 'px';
  }
}

function syncTextsFromEditors() {
  document.querySelectorAll('.text-editor').forEach(ed => {
    const idx = parseInt(ed.dataset.index);
    if (!isNaN(idx) && state.texts[idx]) {
      state.texts[idx].html = ed.innerHTML;
    }
  });
}

function applyFontSizeToEditor(editor, size) {
  if (!editor) return;
  editor.style.fontSize = size + 'px';
  for (const child of editor.children) {
    if (child.nodeType === Node.ELEMENT_NODE) {
      child.style.fontSize = size + 'px';
    }
  }
}

/* ═══════════════════════════════════════
   INIT
   ═══════════════════════════════════════ */
let initialized = false;

function init() {
  if (initialized) return;
  initialized = true;
  const savedTheme = localStorage.getItem('sbs-theme') || 'dark';
  state.theme = savedTheme;
  setTheme(savedTheme);

  // Populate font select
  FONTS.forEach(f => {
    const opt = document.createElement('option');
    opt.value = f;
    opt.textContent = f;
    if (f === state.texts[0].fontFamily) opt.selected = true;
    fontSelect.appendChild(opt);
  });

  // Build initial layout
  rebuildLayout();
  syncUIFromState();

  // Initial snapshot
  pushSnapshot();

  // Load font
  loadGoogleFont(state.texts[0].fontFamily);

  // Bind events
  bindEvents();

  // Initial render
  scheduleRender();
  setTimeout(() => {
    document.querySelectorAll('.text-editor').forEach(ed => adjustTextVerticalCenter(ed));
  }, 50);
}

/* ═══════════════════════════════════════
   FONT LOADING
   ═══════════════════════════════════════ */
function loadGoogleFont(family) {
  const linkId = 'sbs-font-link';
  const existing = document.getElementById(linkId);
  if (existing) existing.remove();
  const link = document.createElement('link');
  link.id = linkId;
  link.rel = 'stylesheet';
  link.href = `https://fonts.googleapis.com/css2?family=${encodeURIComponent(family)}:ital,wght@0,400;0,700;1,400;1,700&display=swap`;
  document.head.appendChild(link);
}

/* ═══════════════════════════════════════
   IMAGE LOADING
   ═══════════════════════════════════════ */
function loadImageToIndex(idx, file) {
  const reader = new FileReader();
  reader.onload = e => {
    state.images[idx].dataUrl = e.target.result;
    rebuildLayout();
    setActiveImage(idx);
    const wrapper = document.querySelector(`.drop-zone-wrapper[data-index="${idx}"]`);
    if (wrapper) {
      const preview = wrapper.querySelector('.image-preview');
      const zone = wrapper.querySelector('.drop-zone');
      preview.src = state.images[idx].dataUrl;
      zone.classList.add('has-image');
      applyImageTransform(idx);
      preview.onload = () => {
        state.images[idx].naturalW = preview.naturalWidth;
        state.images[idx].naturalH = preview.naturalHeight;
        snapshotAndRender();
      };
      if (preview.complete && preview.naturalHeight > 0) {
        state.images[idx].naturalW = preview.naturalWidth;
        state.images[idx].naturalH = preview.naturalHeight;
        snapshotAndRender();
      }
    }
  };
  reader.readAsDataURL(file);
}

function applyImageTransform(idx) {
  const wrapper = document.querySelector(`.drop-zone-wrapper[data-index="${idx}"]`);
  if (!wrapper) return;
  const preview = wrapper.querySelector('.image-preview');
  const img = state.images[idx] || state.images[0];
  const rot = img.rotation;
  const scale = img.zoom / 100;
  preview.style.transform = `rotate(${rot}deg) scale(${scale})`;
  preview.style.objectFit = img.fitFill === 'fit' ? 'contain' : 'cover';
}

function updateImageTransform() {
  const idx = state.activeImageIdx;
  const img = state.images[idx];
  if (!img) return;
  const wrapper = document.querySelector(`.drop-zone-wrapper[data-index="${idx}"]`);
  if (!wrapper) return;
  const preview = wrapper.querySelector('.image-preview');
  preview.style.transform = `rotate(${img.rotation}deg) scale(${img.zoom / 100})`;
  preview.style.objectFit = img.fitFill === 'fit' ? 'contain' : 'cover';
}

/* ═══════════════════════════════════════
   EVENTS
   ═══════════════════════════════════════ */
function bindEvents() {
  // ─── Theme ───
  $('themeToggle').addEventListener('click', () => {
    setTheme(state.theme === 'dark' ? 'light' : 'dark');
    scheduleRender();
  });

  // ─── Undo / Redo ───
  $('undoBtn').addEventListener('click', undo);
  $('redoBtn').addEventListener('click', redo);
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !e.shiftKey) {
      e.preventDefault(); undo();
    }
    if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || (e.key === 'z' && e.shiftKey))) {
      e.preventDefault(); redo();
    }
  });

  // ─── Config GUI ───
  configBtn.addEventListener('click', toggleConfigDropdown);
  document.querySelectorAll('.config-option').forEach(opt => {
    opt.addEventListener('click', () => selectConfig(opt.dataset.config));
  });
  document.addEventListener('click', e => {
    if (!configBtn.contains(e.target) && !configDropdown.contains(e.target)) {
      closeConfigDropdown();
    }
  });

  // ─── Paste globally → active drop zone ───
  document.addEventListener('paste', e => {
    const items = e.clipboardData.items;
    for (const item of items) {
      if (item.type.startsWith('image/')) {
        const file = item.getAsFile();
        if (file) { loadImageToIndex(state.activeImageIdx, file); break; }
      }
    }
  });

  // ─── Image Tools ───
  zoomSlider.addEventListener('input', () => {
    const idx = state.activeImageIdx;
    state.images[idx].zoom = parseFloat(zoomSlider.value);
    zoomValue.textContent = state.images[idx].zoom + '%';
    updateImageTransform();
    syncTextsFromEditors();
    debouncedSnapshot();
    scheduleRender();
  });

  rotateCCW.addEventListener('click', () => {
    const idx = state.activeImageIdx;
    state.images[idx].rotation = (state.images[idx].rotation - 90) % 360;
    updateImageTransform();
    snapshotAndRender();
  });
  rotateCW.addEventListener('click', () => {
    const idx = state.activeImageIdx;
    state.images[idx].rotation = (state.images[idx].rotation + 90) % 360;
    updateImageTransform();
    snapshotAndRender();
  });
  zoomResetBtn.addEventListener('click', () => {
    const idx = state.activeImageIdx;
    state.images[idx].zoom = 100;
    zoomSlider.value = 100;
    zoomValue.textContent = '100%';
    updateImageTransform();
    snapshotAndRender();
  });

  fitOpt.addEventListener('click', () => {
    const idx = state.activeImageIdx;
    state.images[idx].fitFill = 'fit';
    fitOpt.classList.add('active'); fillOpt.classList.remove('active');
    updateImageTransform();
    snapshotAndRender();
  });
  fillOpt.addEventListener('click', () => {
    const idx = state.activeImageIdx;
    state.images[idx].fitFill = 'fill';
    fillOpt.classList.add('active'); fitOpt.classList.remove('active');
    updateImageTransform();
    snapshotAndRender();
  });

  // ─── Image Title ───
  const imgTitleInput = $('imgTitleInput');
  if (imgTitleInput) {
    imgTitleInput.addEventListener('input', () => {
      const idx = state.activeImageIdx;
      state.images[idx].title = imgTitleInput.value;
      const overlay = document.querySelector(`.img-title-overlay[data-index="${idx}"]`);
      if (overlay) overlay.textContent = imgTitleInput.value;
      debouncedSnapshot();
      scheduleRender();
    });
  }

  // ─── Text Formatting (applies to active editor) ───
  boldBtn.addEventListener('click', () => execOnActive('bold'));
  italicBtn.addEventListener('click', () => execOnActive('italic'));
  underlineBtn.addEventListener('click', () => execOnActive('underline'));

  alignLeft.addEventListener('click', () => {
    execOnActive('justifyLeft');
    state.texts[state.activeTextIdx].textAlign = 'left';
    highlightAlign();
    snapshotAndRender();
  });
  alignCenter.addEventListener('click', () => {
    execOnActive('justifyCenter');
    state.texts[state.activeTextIdx].textAlign = 'center';
    highlightAlign();
    snapshotAndRender();
  });
  alignRight.addEventListener('click', () => {
    execOnActive('justifyRight');
    state.texts[state.activeTextIdx].textAlign = 'right';
    highlightAlign();
    snapshotAndRender();
  });

  textColorInput.addEventListener('input', () => {
    const idx = state.activeTextIdx;
    state.texts[idx].textColor = textColorInput.value;
    const editor = getTextEditor(idx);
    if (editor) {
      execOnActive('foreColor', false, state.texts[idx].textColor);
    }
    snapshotAndRender();
  });

  bgColorInput.addEventListener('input', () => {
    state.bgColor = bgColorInput.value;
    rightPanel.style.background = state.bgColor;
    snapshotAndRender();
  });

  fontSelect.addEventListener('change', () => {
    const idx = state.activeTextIdx;
    state.texts[idx].fontFamily = fontSelect.value;
    loadGoogleFont(state.texts[idx].fontFamily);
    const editor = getTextEditor(idx);
    if (editor) editor.style.fontFamily = `"${state.texts[idx].fontFamily}", sans-serif`;
    snapshotAndRender();
  });

  fontSizeSlider.addEventListener('input', () => {
    const idx = state.activeTextIdx;
    state.texts[idx].fontSize = parseFloat(fontSizeSlider.value);
    fontSizeVal.textContent = state.texts[idx].fontSize;
    const editor = getTextEditor(idx);
    if (editor) {
      applyFontSizeToEditor(editor, state.texts[idx].fontSize);
      adjustTextVerticalCenter(editor);
    }
    debouncedSnapshot();
    scheduleRender();
  });
  fontSizeSlider.addEventListener('change', () => { pushSnapshot(); updateUndoButtons(); });

  // ─── Font Size Stepper ───
  document.querySelector('.step-up')?.addEventListener('click', () => stepFontSize(1));
  document.querySelector('.step-down')?.addEventListener('click', () => stepFontSize(-1));

  function stepFontSize(delta) {
    const idx = state.activeTextIdx;
    const newVal = Math.min(120, Math.max(12, state.texts[idx].fontSize + delta));
    if (newVal === state.texts[idx].fontSize) return;
    state.texts[idx].fontSize = newVal;
    fontSizeSlider.value = newVal;
    fontSizeVal.textContent = newVal;
    const editor = getTextEditor(idx);
    if (editor) {
      applyFontSizeToEditor(editor, newVal);
      adjustTextVerticalCenter(editor);
    }
    snapshotAndRender();
  }

  letterSpacingSlider.addEventListener('input', () => {
    const idx = state.activeTextIdx;
    state.texts[idx].letterSpacing = parseFloat(letterSpacingSlider.value);
    letterSpacingVal.textContent = state.texts[idx].letterSpacing;
    const editor = getTextEditor(idx);
    if (editor) editor.style.letterSpacing = state.texts[idx].letterSpacing + 'px';
    debouncedSnapshot();
    scheduleRender();
  });
  letterSpacingSlider.addEventListener('change', () => { pushSnapshot(); updateUndoButtons(); });

  // ─── Divider ───
  divider.addEventListener('mousedown', startDividerDrag);

  // ─── Invert Panels ───
  invertBtn.addEventListener('click', () => {
    state.panelOrder = state.panelOrder === 'normal' ? 'inverted' : 'normal';
    workspace.style.flexDirection = state.panelOrder === 'inverted' ? 'row-reverse' : 'row';
    snapshotAndRender();
  });

  // ─── Aspect Ratio ───
  document.querySelectorAll('.ar-group button[data-ar]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.ar-group button[data-ar]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.aspectRatio = btn.dataset.ar;
      state.imgHeightMode = false;
      document.getElementById('imgHeightBtn').classList.remove('active');
      $('customArInputs').style.display = state.aspectRatio === 'custom' ? 'flex' : 'none';
      snapshotAndRender();
    });
  });

  $('customW').addEventListener('change', () => {
    state.customW = parseInt($('customW').value) || 1920;
    snapshotAndRender();
  });
  $('customH').addEventListener('change', () => {
    state.customH = parseInt($('customH').value) || 1080;
    snapshotAndRender();
  });

  // ─── IMG-Height Toggle ───
  $('imgHeightBtn').addEventListener('click', () => {
    state.imgHeightMode = !state.imgHeightMode;
    $('imgHeightBtn').classList.toggle('active', state.imgHeightMode);
    if (state.imgHeightMode) {
      document.querySelectorAll('.ar-group button[data-ar]').forEach(b => b.classList.remove('active'));
    }
    snapshotAndRender();
  });

  // ─── Export ───
  document.querySelectorAll('.export-group button[data-format]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.downloadFormat = btn.dataset.format;
      document.querySelectorAll('.export-group button[data-format]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      exportImage(state.downloadFormat);
    });
  });
  $('copyImage').addEventListener('click', copyToClipboard);
}

function getTextEditor(idx) {
  const wrapper = document.querySelector(`.text-editor-wrapper[data-index="${idx}"]`);
  return wrapper ? wrapper.querySelector('.text-editor') : null;
}

function execOnActive(cmd, ui, val) {
  const editor = activeTextEditor();
  if (!editor) return;
  editor.focus();
  document.execCommand(cmd, ui, val);
  editor.focus();
  const idx = parseInt(editor.dataset.index);
  if (!isNaN(idx) && state.texts[idx]) {
    state.texts[idx].html = editor.innerHTML;
    applyFontSizeToEditor(editor, state.texts[idx].fontSize);
  }
}

function highlightAlign() {
  document.querySelectorAll('#toolbar button[title*="Align"]').forEach(b => b.classList.remove('active'));
  const align = state.texts[state.activeTextIdx].textAlign;
  if (align === 'left') alignLeft.classList.add('active');
  else if (align === 'center') alignCenter.classList.add('active');
  else if (align === 'right') alignRight.classList.add('active');
}

/* ─── Divider Drag ─── */
function startDividerDrag(e) {
  e.preventDefault();
  divider.classList.add('active');
  const wsRect = workspace.getBoundingClientRect();

  function onMove(ev) {
    let pct = ((ev.clientX - wsRect.left) / wsRect.width) * 100;
    pct = Math.max(15, Math.min(85, pct));
    state.leftPanelPct = pct;
    leftPanel.style.width = pct + '%';
    scheduleRender();
  }

  function onUp() {
    divider.classList.remove('active');
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    pushSnapshot();
  }

  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

/* ═══════════════════════════════════════
   CANVAS RENDERING
   ═══════════════════════════════════════ */
let renderPending = false;
let renderCounter = 0;

function scheduleRender() {
  if (!renderPending) {
    renderPending = true;
    requestAnimationFrame(() => {
      renderPending = false;
      document.fonts.ready.then(doRender);
    });
  }
}

function snapshotAndRender() {
  syncTextsFromEditors();
  pushSnapshot();
  scheduleRender();
}

let debounceTimer = null;
function debouncedSnapshot() {
  if (debounceTimer) clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => {
    syncTextsFromEditors();
    pushSnapshot();
    debounceTimer = null;
  }, 500);
}

function doRender() {
  const currentRender = ++renderCounter;
  const ar = state.aspectRatio;
  let cw, ch;

  if (ar === 'custom') {
    cw = state.customW;
    ch = state.customH;
  } else {
    const parts = ar.split(':').map(Number);
    const baseW = 1600;
    cw = baseW;
    ch = Math.round(baseW * parts[1] / parts[0]);
  }

  // Use first loaded image for IMG-Height mode
  const firstLoadedImg = state.images.find(img => img.naturalH > 0);
  if (state.imgHeightMode && firstLoadedImg) {
    ch = firstLoadedImg.naturalH;
    if (ar === 'custom') {
      cw = Math.round(ch * state.customW / state.customH);
    } else {
      const parts = ar.split(':').map(Number);
      cw = Math.round(ch * parts[0] / parts[1]);
    }
  }

  const scale = state.canvasScale;
  canvas.width = cw * scale;
  canvas.height = ch * scale;

  const w = canvas.width;
  const h = canvas.height;

  ctx.clearRect(0, 0, w, h);

  // Background
  ctx.fillStyle = state.theme === 'dark' ? '#1a1a2e' : '#e8e8ec';
  ctx.fillRect(0, 0, w, h);

  // Panel split
  const lPct = state.leftPanelPct / 100;
  const leftW = w * lPct;
  const rightW = w * (1 - lPct);

  const imgOnLeft = state.panelOrder !== 'inverted';
  const imgW = imgOnLeft ? leftW : rightW;
  const txtW = imgOnLeft ? rightW : leftW;
  const imgX = imgOnLeft ? 0 : leftW;
  const txtX = imgOnLeft ? leftW : 0;
  const dividerW = 0;

  // ── Render Image(s) ──
  const loadedImages = state.images.filter(img => img.dataUrl);
  if (loadedImages.length > 0) {
    let loadedCount = 0;
    const totalImages = state.images.length;

    state.images.forEach((imgData, idx) => {
      if (!imgData.dataUrl) {
        // Draw placeholder for empty slot
        const { subX, subY, subW, subH } = getImageSubArea(idx, totalImages, imgX, 0, imgW, h);
        ctx.fillStyle = state.theme === 'dark' ? '#16213e' : '#f0f0f5';
        ctx.fillRect(subX, subY, subW, subH);
        ctx.fillStyle = '#666';
        ctx.font = '14px Inter, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('No image loaded', subX + subW / 2, subY + subH / 2);
        loadedCount++;
        if (loadedCount === totalImages) {
          renderAllTexts(txtX, txtW, h);
          updatePreviewImage();
        }
        return;
      }

      const img = new Image();
      img.crossOrigin = 'anonymous';

      img.onload = () => {
        if (currentRender !== renderCounter) return;
        const { subX, subY, subW, subH } = getImageSubArea(idx, totalImages, imgX, 0, imgW, h);

        ctx.save();
        ctx.beginPath();
        ctx.rect(subX, subY, subW, subH);
        ctx.clip();

        ctx.translate(subX + subW / 2, subY + subH / 2);
        ctx.rotate((imgData.rotation * Math.PI) / 180);

        const imgAspect = img.width / img.height;
        const areaAspect = subW / subH;

        let dw, dh, dx, dy;
        if (imgData.fitFill === 'fit') {
          if (imgAspect > areaAspect) {
            dw = subW; dh = subW / imgAspect;
            dx = -subW / 2; dy = -dh / 2;
          } else {
            dh = subH; dw = subH * imgAspect;
            dx = -dw / 2; dy = -subH / 2;
          }
        } else {
          if (imgAspect > areaAspect) {
            dh = subH; dw = subH * imgAspect;
            dx = -dw / 2; dy = -subH / 2;
          } else {
            dw = subW; dh = subW / imgAspect;
            dx = -subW / 2; dy = -dh / 2;
          }
        }

        ctx.drawImage(img, dx, dy, dw, dh);
        ctx.restore();

        // Draw image title overlay (top-right)
        if (imgData.title) {
          const titleSize = Math.max(16, Math.min(subW * 0.04, 36)) * scale;
          ctx.save();
          ctx.font = `bold ${titleSize}px Inter, sans-serif`;
          ctx.textAlign = 'right';
          ctx.textBaseline = 'top';
          const tx = subX + subW - 12 * scale;
          const ty = subY + 12 * scale;
          ctx.strokeStyle = '#000';
          ctx.lineWidth = 3 * scale;
          ctx.lineJoin = 'round';
          ctx.strokeText(imgData.title, tx, ty);
          ctx.fillStyle = '#fff';
          ctx.fillText(imgData.title, tx, ty);
          ctx.restore();
        }

        loadedCount++;
        if (loadedCount === totalImages) {
          renderAllTexts(txtX, txtW, h);
          updatePreviewImage();
        }
      };

      img.onerror = () => {
        if (currentRender !== renderCounter) return;
        const { subX, subY, subW, subH } = getImageSubArea(idx, totalImages, imgX, 0, imgW, h);
        ctx.fillStyle = state.theme === 'dark' ? '#16213e' : '#f0f0f5';
        ctx.fillRect(subX, subY, subW, subH);
        ctx.fillStyle = '#666';
        ctx.font = '14px Inter, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Image failed to load', subX + subW / 2, subY + subH / 2);
        loadedCount++;
        if (loadedCount === totalImages) {
          renderAllTexts(txtX, txtW, h);
          updatePreviewImage();
        }
      };

      img.src = imgData.dataUrl;
    });
  } else {
    // No images — draw placeholder(s)
    const totalImages = state.images.length;
    for (let idx = 0; idx < totalImages; idx++) {
      const { subX, subY, subW, subH } = getImageSubArea(idx, totalImages, imgX, 0, imgW, h);
      ctx.fillStyle = state.theme === 'dark' ? '#16213e' : '#f0f0f5';
      ctx.fillRect(subX, subY, subW, subH);
      ctx.fillStyle = '#666';
      ctx.font = '14px Inter, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('No image loaded', subX + subW / 2, subY + subH / 2);
    }
    renderAllTexts(txtX, txtW, h);
    updatePreviewImage();
  }
}

function getImageSubArea(idx, total, imgX, imgY, imgW, imgH) {
  if (total <= 1) {
    return { subX: imgX, subY: imgY, subW: imgW, subH: imgH };
  }
  const eachH = imgH / total;
  // For 2 images, stack vertically
  return {
    subX: imgX,
    subY: imgY + idx * eachH,
    subW: imgW,
    subH: eachH
  };
}

function renderAllTexts(txtX, txtW, totalH) {
  const count = state.texts.length;
  if (count === 0) return;

  // Fill text area background
  ctx.fillStyle = state.bgColor;
  ctx.fillRect(txtX, 0, txtW, totalH);

  const textAreas = [];
  if (count === 1) {
    textAreas.push({ x: txtX, y: 0, w: txtW, h: totalH, textIdx: 0 });
  } else {
    const eachH = totalH / count;
    for (let i = 0; i < count; i++) {
      textAreas.push({ x: txtX, y: i * eachH, w: txtW, h: eachH, textIdx: i });
    }
  }

  for (const area of textAreas) {
    renderTextOnCanvas(area.textIdx, area.x, area.y, area.w, area.h);
  }
}

function renderTextOnCanvas(textIdx, txtX, txtY, txtW, txtH) {
  const txtData = state.texts[textIdx];
  if (!txtData) return;

  const scale = state.canvasScale;
  const defaultStyle = {
    bold: false,
    italic: false,
    underline: false,
    color: txtData.textColor,
    fontFamily: txtData.fontFamily,
    fontSize: txtData.fontSize,
    letterSpacing: txtData.letterSpacing
  };

  const blocks = parseHTML(txtData.html, txtData.textAlign, defaultStyle);
  if (blocks.length === 0) return;

  const pad = txtW * 0.06;
  const x = txtX + pad;
  const maxW = txtW - pad * 2;
  const lineH = txtData.fontSize * scale * 1.5;

  ctx.save();
  ctx.textBaseline = 'top';
  ctx.textAlign = 'left';

  // Clip to text area
  ctx.beginPath();
  ctx.rect(txtX, txtY, txtW, txtH);
  ctx.clip();

  // Re-fill background for this sub-area
  ctx.fillStyle = state.bgColor;
  ctx.fillRect(txtX, txtY, txtW, txtH);

  // First pass: measure text height (dry run)
  let measureY = txtY + pad;
  for (const block of blocks) {
    measureY = renderBlock(ctx, block, x, measureY, maxW, lineH, block.align, scale, true);
    if (measureY > txtY + txtH * 2) break;
  }

  const textHeight = measureY - (txtY + pad);
  const availH = txtH - pad * 2;
  const yOffset = txtY + pad + Math.max(0, (availH - textHeight) / 2);

  // Second pass: render
  let y = yOffset;
  for (const block of blocks) {
    y = renderBlock(ctx, block, x, y, maxW, lineH, block.align, scale, false);
    if (y > txtY + txtH * 2) break;
  }

  ctx.restore();
}

function parseHTML(html, defaultAlign, defaultStyle) {
  const container = document.createElement('div');
  container.innerHTML = html;

  const blocks = [];

  function extractRuns(node, inherited, runs, skipBr) {
    if (node.nodeType === Node.TEXT_NODE) {
      if (node.textContent) {
        runs.push({ text: node.textContent, ...inherited });
      }
      return;
    }
    if (node.nodeType !== Node.ELEMENT_NODE) return;

    const tag = node.tagName.toLowerCase();
    const s = { ...inherited };

    if (['b', 'strong'].includes(tag)) s.bold = true;
    if (['i', 'em'].includes(tag)) s.italic = true;
    if (['u', 'ins'].includes(tag)) s.underline = true;
    if (tag === 'font') {
      const c = node.getAttribute('color');
      if (c) s.color = normalizeColor(c);
    }
    const styleColor = node.style && node.style.color;
    if (styleColor) s.color = normalizeColor(styleColor);
    const styleFont = node.style && node.style.fontFamily;
    if (styleFont) s.fontFamily = styleFont;

    if (tag === 'br' && !skipBr) {
      runs.push({ break: true });
      return;
    }

    const children = Array.from(node.childNodes);
    // contenteditable wraps each Enter-pressed line in a <div> or <p>.
    // Detect a block element whose children are all block elements (each = a line).
    const isBlockWithBlocks = (tag === 'div' || tag === 'p') &&
      children.length > 1 &&
      children.every(c => c.nodeType === Node.ELEMENT_NODE &&
        (c.tagName === 'DIV' || c.tagName === 'P'));

    if (isBlockWithBlocks) {
      for (let i = 0; i < children.length; i++) {
        if (i > 0) runs.push({ break: true });
        extractRuns(children[i], s, runs, true);
      }
    } else {
      for (const child of children) {
        extractRuns(child, s, runs, false);
      }
    }
  }

  for (const child of container.childNodes) {
    if (child.nodeType === Node.TEXT_NODE && child.textContent.trim()) {
      blocks.push({
        align: defaultAlign,
        runs: [{ text: child.textContent, ...defaultStyle }]
      });
    } else if (child.nodeType === Node.ELEMENT_NODE) {
      const align = child.style && child.style.textAlign ? child.style.textAlign : defaultAlign;
      const runs = [];
      extractRuns(child, defaultStyle, runs);
      if (runs.length > 0) {
        const merged = [];
        for (const r of runs) {
          if (r.break) { merged.push(r); continue; }
          const last = merged[merged.length - 1];
          if (last && !last.break && stylesEqual(last, r) && !r.text.includes('\n')) {
            last.text += r.text;
          } else {
            const parts = r.text.split('\n');
            for (let i = 0; i < parts.length; i++) {
              if (parts[i]) {
                const clone = { ...r, text: parts[i] };
                const lastM = merged[merged.length - 1];
                if (lastM && stylesEqual(lastM, clone)) {
                  lastM.text += ' ' + clone.text;
                } else {
                  merged.push(clone);
                }
              }
              if (i < parts.length - 1) {
                merged.push({ break: true });
              }
            }
          }
        }
        blocks.push({ align, runs: merged });
      }
    }
  }

  return blocks;
}

function stylesEqual(a, b) {
  return a.bold === b.bold && a.italic === b.italic && a.underline === b.underline &&
         a.color === b.color && a.fontFamily === b.fontFamily &&
         a.fontSize === b.fontSize && a.letterSpacing === b.letterSpacing;
}

function normalizeColor(color) {
  if (!color) return '#ffffff';
  if (color.startsWith('#')) return color;
  const m = color.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
  if (m) {
    return '#' + [m[1], m[2], m[3]].map(v => parseInt(v).toString(16).padStart(2, '0')).join('');
  }
  return '#ffffff';
}

function renderBlock(ctx, block, x, y, maxWidth, lineHeight, align, scale, dryRun) {
  const runs = block.runs;
  if (!runs || runs.length === 0) return y;

  const words = [];
  for (const run of runs) {
    if (run.break) {
      words.push({ break: true });
      continue;
    }
    const parts = run.text.split(/(\s+)/);
    for (const p of parts) {
      if (!p) continue;
      if (/^\s+$/.test(p)) {
        words.push({ text: p, style: run, isSpace: true });
      } else {
        const m = p.match(/^(\S+)(\s+)?/);
        if (m) {
          words.push({ text: m[1], style: run, isSpace: false });
          if (m[2]) words.push({ text: m[2], style: run, isSpace: true });
        } else {
          words.push({ text: p, style: run, isSpace: false });
        }
      }
    }
  }

  if (words.length === 0) return y;

  let lines = [];
  let currentLine = [];
  let currentW = 0;

  for (const word of words) {
    if (word.break) {
      if (currentLine.length > 0) {
        lines.push(currentLine);
        currentLine = [];
        currentW = 0;
      }
      lines.push([]);
      continue;
    }

    ctx.font = buildFontString(word.style, scale);
    const tw = ctx.measureText(word.text).width;

    if (currentW + tw > maxWidth && currentLine.length > 0) {
      lines.push(currentLine);
      currentLine = [word];
      currentW = tw;
    } else {
      currentLine.push(word);
      currentW += tw;
    }
  }

  if (currentLine.length > 0) {
    lines.push(currentLine);
  }

  if (dryRun) {
    const emptyLines = lines.filter(l => l.length === 0).length;
    const textLines = lines.filter(l => l.length > 0).length;
    return y + emptyLines * lineHeight * 0.6 + textLines * lineHeight;
  }

  for (const line of lines) {
    if (line.length === 0) {
      y += lineHeight * 0.6;
      continue;
    }

    let totalW = 0;
    for (const w of line) {
      ctx.font = buildFontString(w.style, scale);
      totalW += ctx.measureText(w.text).width;
    }

    let startX = x;
    if (align === 'center') startX = x + (maxWidth - totalW) / 2;
    else if (align === 'right') startX = x + maxWidth - totalW;

    let penX = startX;
    let maxAscent = 0;

    for (const w of line) {
      ctx.font = buildFontString(w.style, scale);
      ctx.fillStyle = w.style.color;

      const metrics = ctx.measureText(w.text);
      const ascent = metrics.fontBoundingBoxAscent || w.style.fontSize * scale * 0.8;
      maxAscent = Math.max(maxAscent, ascent);

      if (w.style.letterSpacing > 0 && !w.isSpace) {
        const ls = w.style.letterSpacing * scale;
        let cx = penX;
        for (const char of w.text) {
          ctx.fillText(char, cx, y);
          cx += ctx.measureText(char).width + ls;
        }
        penX += ctx.measureText(w.text).width + (w.text.length - 1) * ls;
      } else {
        ctx.fillText(w.text, penX, y);
        penX += ctx.measureText(w.text).width;
      }
    }

    let anyUnderline = false;
    for (const w of line) {
      if (w.style.underline && !w.isSpace) { anyUnderline = true; break; }
    }
    if (anyUnderline) {
      let ux = startX;
      for (const w of line) {
        ctx.font = buildFontString(w.style, scale);
        const tw = ctx.measureText(w.text).width;
        if (w.style.underline && !w.isSpace) {
          const yline = y + maxAscent + 2 * scale;
          ctx.fillStyle = w.style.color;
          ctx.fillRect(ux, yline, tw, Math.max(1, scale));
        }
        ux += tw;
      }
    }

    y += lineHeight;
  }

  return y;
}

function buildFontString(style, scale) {
  const size = (style.fontSize || 32) * scale;
  const family = style.fontFamily || 'Inter';
  const italic = style.italic ? 'italic ' : '';
  const bold = style.bold ? 'bold ' : '';
  return `${italic}${bold}${size}px "${family}", sans-serif`;
}

/* ─── Preview Update ─── */
function updatePreviewImage() {
  const preview = $('textPreviewContent');
  const section = $('textPreviewSection');
  const header = $('textPreviewHeader');
  preview.src = canvas.toDataURL('image/png');
  section.style.background = state.bgColor;

  const firstLoadedImg = state.images.find(img => img.naturalH > 0);
  if (state.imgHeightMode && firstLoadedImg) {
    const maxH = Math.min(firstLoadedImg.naturalH, 400);
    section.style.maxHeight = maxH + 'px';
    const ar = canvas.width / canvas.height;
    const headerH = header.offsetHeight || 18;
    let previewH = Math.max(40, Math.min(maxH, 400));
    let previewW = previewH * ar;
    const sectionW = section.clientWidth;
    if (previewW > sectionW) {
      previewW = sectionW;
      previewH = previewW / ar;
    }
    preview.style.width = previewW + 'px';
    preview.style.height = previewH + 'px';
    section.style.height = (previewH + headerH) + 'px';
    return;
  }
  const headerH = header.offsetHeight || 18;
  preview.style.width = '100%';
  preview.style.height = '120px';
  section.style.maxHeight = '40%';
  section.style.height = (120 + headerH) + 'px';
}

/* ═══════════════════════════════════════
   EXPORT
   ═══════════════════════════════════════ */
function exportImage(format) {
  const link = document.createElement('a');
  link.download = `sidebyside.${format === 'jpeg' ? 'jpg' : format}`;
  canvas.toBlob(blob => {
    if (!blob) { showToast('Export failed'); return; }
    link.href = URL.createObjectURL(blob);
    link.click();
    URL.revokeObjectURL(link.href);
    showToast(`Downloaded as ${format.toUpperCase()}`);
  }, format === 'webp' ? 'image/webp' : format === 'jpeg' ? 'image/jpeg' : 'image/png', 0.95);
}

function copyToClipboard() {
  canvas.toBlob(blob => {
    if (!blob) { showToast('Copy failed'); return; }
    try {
      navigator.clipboard.write([
        new ClipboardItem({ [blob.type]: blob })
      ]).then(() => showToast('Image copied to clipboard!'))
      .catch(() => fallbackCopy());
    } catch {
      fallbackCopy();
    }
  }, 'image/png');
}

function fallbackCopy() {
  const url = canvas.toDataURL('image/png');
  const img = document.createElement('img');
  img.src = url;
  img.style.position = 'fixed';
  img.style.top = '-9999px';
  document.body.appendChild(img);
  showToast('Right-click the preview to copy');
  setTimeout(() => document.body.removeChild(img), 1000);
}

/* ═══════════════════════════════════════
   TOAST
   ═══════════════════════════════════════ */
let toastTimer = null;
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
}

/* ═══════════════════════════════════════
   START
   ═══════════════════════════════════════ */
document.addEventListener('DOMContentLoaded', init);
if (document.readyState === 'complete' || document.readyState === 'interactive') {
  init();
}

})();
</script>
